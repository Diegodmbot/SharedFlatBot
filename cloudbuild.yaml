# cloudbuild.yaml — SharedFlatBot
# Compila la imagen Docker, la sube a Artifact Registry y despliega en Cloud Run.
#
# Variables que debes sustituir antes de usar:
#   PROJECT_ID   → tu ID de proyecto en GCP
#   REGION       → región de despliegue (ej. us-central1)
#   SA_EMAIL     → email del service account (ej. bot-sa@PROJECT_ID.iam.gserviceaccount.com)

substitutions:
  _REGION: europe-southwest1
  _SERVICE_NAME: shared-flat-bot
  _IMAGE: europe-southwest1-docker.pkg.dev/shared-flat-bot/shared-flat-bot

options:
  logging: CLOUD_LOGGING_ONLY # Evita el error de logs bucket con service account

serviceAccount: "projects/shared-flat-bot/serviceAccounts/326592649239-compute@developer.gserviceaccount.com"
# ↑ Reemplaza SA_EMAIL por el email real de tu service account, o elimina esta línea
#   si usas la cuenta de servicio por defecto de Cloud Build.

steps:
  # ── 1. Build ──────────────────────────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "build"
    args:
      - build
      - -t
      - "$_IMAGE:$SHORT_SHA" # tag con el hash del commit
      - -t
      - "$_IMAGE:latest"
      - .

  # ── 2. Push ───────────────────────────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "push"
    args:
      - push
      - --all-tags
      - "$_IMAGE"

  # ── 3. Deploy a Cloud Run ─────────────────────────────────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "$_SERVICE_NAME"
      - --image=$_IMAGE:$SHORT_SHA
      - --region=$_REGION
      - --platform=managed
      - --allow-unauthenticated # quita esta línea si el bot no necesita ser público
      - --memory=256Mi
      - --cpu=1
      - --min-instances=0 # escala a 0 cuando no hay tráfico → free tier
      - --max-instances=1
      - --port=8080

images:
  - "$_IMAGE:$SHORT_SHA"
  - "$_IMAGE:latest"
